services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            # Origin of the LedgerX backend the embedded nginx reverse-proxies /api/ to.
            # Reaches the backend directly by service name on the shared
            # "ledgerx-backend_default" network (see the "networks" section below), avoiding
            # host.docker.internal, which on Docker Desktop can resolve to an unreachable IPv6
            # address and cause intermittent connection failures.
            - "BACKEND_ORIGIN=${BACKEND_ORIGIN:-https://ledgerx:8080}"
        ports:
            - "${FRONTEND_PORT:-4200}:80"
        networks:
            - default
            - ledgerx-backend_default
        restart: unless-stopped

networks:
    ledgerx-backend_default:
        external: true
